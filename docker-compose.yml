services:
  postgres:
    image: postgres:16
    container_name: forex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: 
      - "5433:5432" # Maps to 5433 on your PC to avoid conflicts
    volumes: 
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: forex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: 
      - "6379:6379"
    volumes: 
      - redisdata:/data

  api:
    build: ./apps/api
    container_name: forex-api
    env_file: ./apps/api/.env
    depends_on: 
      - postgres
      - redis
    ports: 
      - "4000:4000"

  web:
    build: ./apps/web
    container_name: forex-web
    env_file: .env
    depends_on: 
      - api
    ports: 
      - "3000:3000"

  admin:
    build: ./apps/admin
    container_name: forex-admin
    env_file: .env
    depends_on: 
      - api
    ports: 
      - "3001:3001"

volumes:
  pgdata:
  redisdata: